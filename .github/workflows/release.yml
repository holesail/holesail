name: Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

env:
  # The Bare ecosystem has moved past what this tree pins: bare-module@6.1.2
  # needs js_on_dynamic_import_transitional, which bare-headers dropped in
  # 1.29.4, and the newer headers no longer match the rest of the tree.
  # Resolve npm as of the last coherent release instead of floating.
  NPM_CONFIG_BEFORE: 2025-11-20

jobs:
  build:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64, platform: linux, arch: x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64, platform: linux, arch: arm64 }
          - { os: ubuntu-22.04, name: android-x64, platform: android, arch: x64, flags: -D ANDROID_STL=c++_static }
          - { os: ubuntu-22.04, name: android-ia32, platform: android, arch: ia32, flags: -D ANDROID_STL=c++_static }
          - { os: ubuntu-22.04, name: android-arm64, platform: android, arch: arm64, flags: -D ANDROID_STL=c++_static }
          - { os: ubuntu-22.04, name: android-arm, platform: android, arch: arm, flags: -D ANDROID_STL=c++_static }
          - { os: macos-14, name: darwin-x64, platform: darwin, arch: x64 }
          - { os: macos-14, name: darwin-arm64, platform: darwin, arch: arm64 }
          - { os: macos-14, name: ios-arm64, platform: ios, arch: arm64 }
          - { os: macos-14, name: ios-arm64-simulator, platform: ios, arch: arm64, flags: --simulator }
          - { os: macos-14, name: ios-x64-simulator, platform: ios, arch: x64, flags: --simulator }
          - { os: windows-2022, name: win32-x64, platform: win32, arch: x64, flags: -D CMAKE_C_FLAGS=-Wno-incompatible-pointer-types }
          - { os: windows-2022, name: win32-arm64, platform: win32, arch: arm64, flags: -D CMAKE_C_FLAGS=-Wno-incompatible-pointer-types }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_drive
          key: drive-${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
        if: ${{ matrix.platform == 'linux' }}
      - name: Install LLVM
        run: choco upgrade llvm
        if: ${{ matrix.platform == 'win32' }}
      - name: Install nasm
        run: choco install nasm
        if: ${{ matrix.platform == 'win32' }}
      - run: npm install -g bare-make
      - run: npm install
      - run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ matrix.flags }}
      - name: Patch the missing cast in libjstl
        shell: bash
        run: |
          # js_create_string() passes a const char[] straight to
          # js_create_string_utf8(), which takes a utf8_t. Upstream fixed this
          # in 65d402c, which is also the commit that dropped the string getter
          # this tree still calls, so apply the cast to the pinned commit.
          # Done with node because BSD sed on macOS needs -i ''.
          node -e '
            const fs = require("fs")
            const p = "build/_deps/github+holepunchto+libjstl-src/include/jstl.h"
            const from = "js_create_string_utf8(env, value, N,"
            const to = "js_create_string_utf8(env, reinterpret_cast<const utf8_t *>(value), N,"
            const s = fs.readFileSync(p, "utf8")
            if (!s.includes(from)) throw new Error("pattern not found in " + p)
            fs.writeFileSync(p, s.replace(from, to))
          '
      - run: bare-make build
      - run: bare-make install --strip --prefix install/${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: install/${{ matrix.name }}/bin
          retention-days: 5

  appimage:
    name: "appimage-${{ matrix.arch }}"
    needs: [build]
    runs-on: ${{ matrix.runs-on }}
    container: ghcr.io/pkgforge-dev/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-24.04, arch: x86_64, name: linux-x64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.name }}
          path: ./pkg
      - name: Install holesail
        env:
          HOLESAIL_BIN: ./pkg/holesail
        run: /bin/sh ./appimage/get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./appimage/make-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*
          retention-days: 5

  release:
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.appimage.result == 'success' }}
    needs: [build, appimage]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p out
          for dir in dist/*/; do
            name=$(basename "$dir")
            case "$name" in
              appimage-*)
                for f in "$dir"*.AppImage "$dir"*.zsync; do
                  if [ -f "$f" ]; then cp "$f" "$GITHUB_WORKSPACE/out/"; fi
                done
                ;;
              linux-*) ;;
              *) (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" .) ;;
            esac
          done
          VERSION=$(awk -F'"' '/"version"/{print $4; exit}' package.json)
          if [ "${GITHUB_REF_TYPE-}" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" \
              --title "holesail: $VERSION" \
              --latest \
              --notes "holesail $VERSION, built from source with bare-make for every platform the project targets, with Anylinux AppImages for the Linux builds." \
              out/*
          fi
