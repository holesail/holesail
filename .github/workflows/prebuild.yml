name: Build

on:
  workflow_dispatch:

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== Android =====
          - os: ubuntu-22.04
            platform: android
            arch: x64
            flags: -D ANDROID_STL=c++_static

          - os: ubuntu-22.04
            platform: android
            arch: ia32
            flags: -D ANDROID_STL=c++_static

          - os: ubuntu-22.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_static

          - os: ubuntu-22.04
            platform: android
            arch: arm
            flags: -D ANDROID_STL=c++_static

          # ===== macOS =====
          - os: macos-14
            platform: darwin
            arch: x64

          - os: macos-14
            platform: darwin
            arch: arm64

          # ===== iOS =====
          - os: macos-14
            platform: ios
            arch: arm64

          - os: macos-14
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator

          - os: macos-14
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator

          # ===== Windows =====
          - os: windows-2022
            platform: win32
            arch: x64

          - os: windows-2022
            platform: win32
            arch: arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_drive
          key: corestore-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ===== Windows deps =====
      - name: Install LLVM (Windows)
        if: ${{ matrix.platform == 'win32' }}
        run: choco upgrade llvm

      - name: Install NASM (Windows)
        if: ${{ matrix.platform == 'win32' }}
        run: choco install nasm -y

      # ===== Build =====
      - run: npm install -g bare-make
      - run: npm install

      - run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ matrix.flags }}

      - run: bare-make build

      - run: bare-make install --strip --prefix install/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

      # ===== Artifacts =====
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: install/${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}/bin/*
          retention-days: 1

  prebuild-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: ubuntu-22.04
            arch: ia32
            flags: -D CMAKE_C_FLAGS=-msse2 -D CMAKE_CXX_FLAGS=-msse2

    runs-on: ${{ matrix.os }}
    name: linux-${{ matrix.arch }}
    container:
      image: ubuntu:19.10

    steps:
      - name: Fix archived apt sources
        run: |
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sed -i 's|http://ports.ubuntu.com/ubuntu-ports|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl wget git ca-certificates gnupg \
            build-essential cmake ninja-build \
            python3 \
            lsb-release software-properties-common
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Install ia32 multilib
        if: ${{ matrix.arch == 'ia32' }}
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y \
            gcc-multilib g++-multilib \
            libc6-dev-i386 \
            libstdc++6:i386

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 20
          apt-get install -y libc++-20-dev libc++abi-20-dev

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_drive
          key: corestore-linux-${{ matrix.arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm install -g bare-make
      - run: npm install

      - run: bare-make generate --platform linux --arch ${{ matrix.arch }} ${{ matrix.flags }}

      - run: bare-make build

      - run: bare-make install --strip --prefix install/linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: install/linux-${{ matrix.arch }}/bin/*
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [prebuild, prebuild-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: install
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: install
          retention-days: 1

